name: Offline Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: daat verify-contracts
      - run: daat validate-build examples/ik-build-envelope.json
      - run: daat alignment-report mappings/native/profile.json
      - run: python -m compileall -q src tests examples
      - run: python -m pytest -q
      - run: python examples/fake_host_demo.py > /dev/null
      - run: python tools/check_markdown_links.py
      - run: python tools/verify_manifest.py
