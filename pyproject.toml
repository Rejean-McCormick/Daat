[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daat-boundary"
version = "0.3.0"
description = "Offline security-enforced external-alignment and Kristal v6 boundary toolkit (pre-production)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
daat = "daat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
daat = ["resources/contracts/**/*.json", "resources/contracts/**/**/*.json"]
