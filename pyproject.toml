[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daat-boundary"
version = "0.5.0"
description = "DaaT offline information bridge and ChatGPT context preparation; pre-production owner-boundary toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5", "rfc3339-validator>=0.1.4,<1"]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
dev = ["pytest>=7"]
pdf = ["pypdf>=5,<9"]

[project.scripts]
daat = "daat.cli:main"
daat-bridge = "daat.information_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
daat = ["resources/contracts/**/*.json", "resources/contracts/**/**/*.json", "resources/data/*.csv", "resources/data/*.json"]
